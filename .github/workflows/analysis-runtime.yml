name: Analysis Runtime

on:
  pull_request:
    paths:
      - 'packages/analysis-runtime/**'
      - '.github/workflows/analysis-runtime.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/analysis-runtime/**'
      - '.github/workflows/analysis-runtime.yml'

permissions:
  contents: read

jobs:
  analysis-runtime:
    name: Verify deterministic analysis runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install analysis runtime with test dependencies
        run: python -m pip install --no-deps '.[test]'
        working-directory: packages/analysis-runtime

      - name: Compile analysis runtime
        run: python -m compileall -q packages/analysis-runtime/src packages/analysis-runtime/tests

      - name: Run analysis runtime tests
        run: python -m pytest -q packages/analysis-runtime/tests
