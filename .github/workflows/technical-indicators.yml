name: Technical Indicators

on:
  pull_request:
    paths:
      - 'engines/technical/**'
      - 'tools/architecture/validate_indicator_structure.py'
      - 'tests/architecture/test_validate_indicator_structure.py'
      - '.github/workflows/technical-indicators.yml'
  push:
    branches:
      - main
    paths:
      - 'engines/technical/**'
      - 'tools/architecture/validate_indicator_structure.py'
      - 'tests/architecture/test_validate_indicator_structure.py'
      - '.github/workflows/technical-indicators.yml'

permissions:
  contents: read

jobs:
  technical-indicators:
    name: Verify deterministic technical indicators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install technical package
        run: python -m pip install --no-deps ./engines/technical

      - name: Compile technical package and architecture guard
        run: python -m compileall -q engines/technical/src engines/technical/tests tools/architecture tests/architecture

      - name: Validate canonical indicator structure
        run: python tools/architecture/validate_indicator_structure.py

      - name: Run indicator tests
        run: python -m unittest discover -s engines/technical/tests -p 'test_*.py' -v

      - name: Run indicator structure regression test
        run: python -m unittest tests.architecture.test_validate_indicator_structure -v
