name: Intelligence Runtime

on:
  pull_request:
    paths:
      - 'packages/intelligence-runtime/**'
      - '.github/workflows/intelligence-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/intelligence-runtime/**'
      - '.github/workflows/intelligence-runtime.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install package test dependencies
        working-directory: packages/intelligence-runtime
        run: python -m pip install -e '.[test]'
      - name: Compile
        working-directory: packages/intelligence-runtime
        run: python -m compileall -q src tests
      - name: Test
        working-directory: packages/intelligence-runtime
        run: python -m pytest -q
