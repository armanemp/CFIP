name: Architecture Contracts

on:
  pull_request:
    paths:
      - 'contexts/**'
      - 'docs/**'
      - 'migrations/**'
      - 'data/migrations/**'
      - 'tools/architecture/**'
      - 'tests/architecture/**'
      - '.github/workflows/architecture-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'contexts/**'
      - 'docs/**'
      - 'migrations/**'
      - 'data/migrations/**'
      - 'tools/architecture/**'
      - 'tests/architecture/**'
      - '.github/workflows/architecture-contracts.yml'

permissions:
  contents: read

jobs:
  architecture-contracts:
    name: Validate target architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate architecture contracts
        run: python tools/architecture/validate_target_contracts.py

      - name: Verify source-closure tooling
        run: python -m unittest discover -s tests/architecture -p 'test_*.py'

      - name: Validate target migration graph when materialized
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d migrations ]]; then
            python tools/architecture/validate_migration_graph.py --migrations-root migrations --format markdown --output /tmp/target-migration-graph.md
          elif [[ -d data/migrations ]]; then
            python tools/architecture/validate_migration_graph.py --migrations-root data/migrations --format markdown --output /tmp/target-migration-graph.md
          else
            echo 'No target migration runtime tree is materialized; Gate 0 remains locked.'
          fi

      - name: Verify worker lifecycle tool contract
        run: python -m unittest tests/architecture/test_validate_worker_lifecycle.py

      - name: Verify dependency direction tool contract
        run: python -m unittest tests/architecture/test_validate_dependency_direction.py

      - name: Verify PIT and replay contract tool
        run: python tools/architecture/validate_pit_replay_contracts.py docs/adr/ADR-004-DATASET-REPLAY-AND-PIT-INTEGRITY.md docs/evidence/CFIP-SOURCE-CLOSURE-TRACEABILITY-RULES.md

      - name: Verify global-scale architecture contract
        run: python tools/architecture/validate_global_scale_contracts.py docs/CFIP-CONTINUATION-PROMPT.md docs/evidence/CFIP-TARGET-FILE-MANIFEST.md
