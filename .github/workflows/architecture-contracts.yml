name: Architecture Contracts

on:
  pull_request:
    paths:
      - 'contexts/**'
      - 'docs/**'
      - 'migrations/**'
      - 'data/migrations/**'
      - 'data/training/**'
      - 'tools/architecture/**'
      - 'tools/governance/**'
      - 'tests/architecture/**'
      - '.github/workflows/architecture-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'contexts/**'
      - 'docs/**'
      - 'migrations/**'
      - 'data/migrations/**'
      - 'data/training/**'
      - 'tools/architecture/**'
      - 'tools/governance/**'
      - 'tests/architecture/**'
      - '.github/workflows/architecture-contracts.yml'

permissions:
  contents: read

jobs:
  architecture-contracts:
    name: Validate target architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate architecture contracts
        run: python tools/architecture/validate_target_contracts.py

      - name: Test migration control consistency
        run: python -m unittest tests/architecture/test_validate_migration_control_consistency.py -v

      - name: Validate migration control consistency
        run: python tools/architecture/validate_migration_control_consistency.py

      - name: Test API and WebSocket census
        run: python -m unittest tests/architecture/test_census_api_ws.py -v

      - name: Test event graph census
        run: python -m unittest tests/architecture/test_census_event_graph.py -v

      - name: Test frontend census
        run: python -m unittest tests/architecture/test_census_frontend.py -v

      - name: Test policy/configuration census
        run: python -m unittest tests/architecture/test_census_policy_config.py -v

      - name: Test engine registry reconciliation
        run: python -m unittest tests/architecture/test_reconcile_engine_registry.py -v

      - name: Test dependency direction
        run: python -m unittest tests/architecture/test_validate_dependency_direction.py -v

      - name: Test global-scale contracts
        run: python -m unittest tests/architecture/test_validate_global_scale_contracts.py -v

      - name: Test platform-intelligence contracts
        run: python -m unittest tests/architecture/test_validate_platform_intelligence_contracts.py -v

      - name: Test platform-intelligence coverage
        run: python -m unittest tests/architecture/test_validate_platform_intelligence_coverage.py -v

      - name: Test migration graph
        run: python -m unittest tests/architecture/test_validate_migration_graph.py -v

      - name: Test PIT and replay contracts
        run: python -m unittest tests/architecture/test_validate_pit_replay_contracts.py -v

      - name: Test worker lifecycle
        run: python -m unittest tests/architecture/test_validate_worker_lifecycle.py -v

      - name: Test training dataset index
        run: python -m unittest tests/architecture/test_validate_training_dataset_index.py -v

      - name: Validate training dataset index
        run: python tools/governance/validate_training_dataset_index.py data/training/CFIP-CFOREX-TRAINING-DATASET-INDEX-v0.1.json

      - name: Validate target migration graph when materialized
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d migrations ]]; then
            python tools/architecture/validate_migration_graph.py --migrations-root migrations --format markdown --output /tmp/target-migration-graph.md
          elif [[ -d data/migrations ]]; then
            python tools/architecture/validate_migration_graph.py --migrations-root data/migrations --format markdown --output /tmp/target-migration-graph.md
          else
            echo 'No target migration runtime tree is materialized; Gate 0 remains locked.'
          fi

      - name: Verify dependency direction tool contract
        run: python tools/architecture/validate_dependency_direction.py --help >/dev/null

      - name: Verify PIT and replay contract tool
        run: python tools/architecture/validate_pit_replay_contracts.py docs/adr/ADR-004-DATASET-REPLAY-AND-PIT-INTEGRITY.md docs/capabilities/CFIP-D3-PIT-REPLAY-EVIDENCE-CONTRACT.md

      - name: Verify global-scale architecture contract
        run: python tools/architecture/validate_global_scale_contracts.py docs/CFIP-CONTINUATION-PROMPT.md docs/CFIP-ARCHITECTURE-GUIDE.md docs/CFIP-MIGRATION-CONTROL-INDEX.md docs/adr/ADR-005-PLATFORM-INTELLIGENCE-AND-AUTONOMOUS-OPERATION.md

      - name: Verify platform-intelligence architecture contract
        run: python tools/architecture/validate_platform_intelligence_contracts.py docs/CFIP-CONTINUATION-PROMPT.md docs/CFIP-ARCHITECTURE-GUIDE.md docs/CFIP-MIGRATION-CONTROL-INDEX.md docs/adr/ADR-005-PLATFORM-INTELLIGENCE-AND-AUTONOMOUS-OPERATION.md

      - name: Verify capability-wide intelligence coverage
        run: python tools/architecture/validate_platform_intelligence_coverage.py docs/capabilities/CFIP-CAPABILITY-REGISTRY.md docs/capabilities/CFIP-PLATFORM-INTELLIGENCE-COVERAGE-MATRIX.md
