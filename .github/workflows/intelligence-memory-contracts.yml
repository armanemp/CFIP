name: Intelligence Memory Contracts

on:
  pull_request:
    paths:
      - 'data/training/CFIP-INTELLIGENCE-MEMORY-INDEX-v0.1.json'
      - 'data/training/CFIP-DATASET-RECONCILIATION-QUEUE-v0.1.json'
      - 'docs/governance/CFIP-INTELLIGENCE-MEMORY-CONTRACT.md'
      - 'docs/governance/CFIP-DATASET-RECONCILIATION-PROTOCOL.md'
      - 'tools/governance/validate_intelligence_memory_index.py'
      - 'tools/governance/validate_dataset_reconciliation_queue.py'
      - 'tests/architecture/test_validate_intelligence_memory_index.py'
      - 'tests/architecture/test_validate_dataset_reconciliation_queue.py'
      - '.github/workflows/intelligence-memory-contracts.yml'
  push:
    branches:
      - main
    paths:
      - 'data/training/CFIP-INTELLIGENCE-MEMORY-INDEX-v0.1.json'
      - 'data/training/CFIP-DATASET-RECONCILIATION-QUEUE-v0.1.json'
      - 'docs/governance/CFIP-INTELLIGENCE-MEMORY-CONTRACT.md'
      - 'docs/governance/CFIP-DATASET-RECONCILIATION-PROTOCOL.md'
      - 'tools/governance/validate_intelligence_memory_index.py'
      - 'tools/governance/validate_dataset_reconciliation_queue.py'
      - 'tests/architecture/test_validate_intelligence_memory_index.py'
      - 'tests/architecture/test_validate_dataset_reconciliation_queue.py'
      - '.github/workflows/intelligence-memory-contracts.yml'

permissions:
  contents: read

jobs:
  intelligence-memory-contracts:
    name: Validate intelligence memory and dataset reconciliation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Test governance contracts
        run: python -m unittest tests/architecture/test_validate_intelligence_memory_index.py tests/architecture/test_validate_dataset_reconciliation_queue.py -v

      - name: Validate intelligence memory index
        run: python tools/governance/validate_intelligence_memory_index.py data/training/CFIP-INTELLIGENCE-MEMORY-INDEX-v0.1.json

      - name: Validate dataset reconciliation queue
        run: python tools/governance/validate_dataset_reconciliation_queue.py data/training/CFIP-DATASET-RECONCILIATION-QUEUE-v0.1.json
