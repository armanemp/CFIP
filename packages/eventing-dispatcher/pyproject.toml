[project]
name = "cfip-eventing-dispatcher"
version = "0.1.0"
description = "CFIP bounded, lease-fenced durable event dispatcher"
requires-python = ">=3.14"
dependencies = [
  "cfip-contracts>=0.1,<0.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_eventing_dispatcher"]

[tool.pytest.ini_options]
pythonpath = ["src", "../contracts/src"]
testpaths = ["tests"]
