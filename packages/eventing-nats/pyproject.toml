[project]
name = "cfip-eventing-nats"
version = "0.1.0"
description = "CFIP NATS JetStream event transport adapter"
requires-python = ">=3.14"
dependencies = [
  "cfip-contracts>=0.1,<0.2",
  "nats-py>=2.15,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_eventing_nats"]

[tool.pytest.ini_options]
pythonpath = ["src", "../contracts/src"]
testpaths = ["tests"]
