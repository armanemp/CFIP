[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfip-intelligence-runtime"
version = "0.1.0"
description = "CFIP governed Platform Intelligence lifecycle contracts"
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_intelligence_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
