[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfip-analysis-postgres"
version = "0.1.0"
description = "CFIP PostgreSQL durability adapter for governed analysis execution"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cfip-analysis-runtime>=0.1,<0.2",
  "SQLAlchemy==2.0.52",
  "psycopg[binary,pool]==3.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_analysis_postgres"]

[tool.pytest.ini_options]
pythonpath = ["src", "../analysis-runtime/src"]
testpaths = ["tests"]
