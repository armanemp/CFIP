[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfip-realtime-runtime"
version = "0.1.0"
description = "Transport-neutral realtime ownership, watermark and backpressure runtime contracts"
requires-python = ">=3.14,<3.15"
dependencies = [
  "cfip-contracts>=0.1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_realtime_runtime"]
