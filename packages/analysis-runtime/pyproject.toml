[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfip-analysis-runtime"
version = "0.1.0"
description = "CFIP deterministic, governed analysis runtime contracts"
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cfip_analysis_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
